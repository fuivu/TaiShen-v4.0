# ═══════════════════════════════════════════════
#  TaiShen Architecture v4.0 — Gradle Properties
#  Local AI Painter — 太神架构
# ═══════════════════════════════════════════════

# ─── JVM 配置 ───────────────────────────────────
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=1g

# ─── 并行编译 ───────────────────────────────────
org.gradle.parallel=true
org.gradle.workers.max=4

# ─── 构建缓存 ───────────────────────────────────
# Gradle 原生缓存（非已废弃的 android.enableBuildCache）
org.gradle.caching=true

# ─── Kotlin 配置 ────────────────────────────────
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.incremental.js=false

# ─── AndroidX ───────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true

# ─── 构建优化 ───────────────────────────────────
# 禁用 PNG crunching 加速构建
android.enablePngCrunchInRelease=false
# 禁用 aapt2 缓存（避免大型项目 OOM）
android.enableAapt2Workers=true
# 允许使用较新的 SDK 编译（抑制警告）
android.suppressUnsupportedCompileSdk=34

# ─── NDK 配置 ───────────────────────────────────
# 使用 NDK 26.1.10909125（已验证兼容）
android.ndkVersion=26.1.10909125

# ─── CMake 配置 ──────────────────────────────────
# 与 CMakeLists.txt 中的版本一致
android.cmakeVersion=3.22.1

# ─── 抑制已弃用 API 警告 ────────────────────────
# ldLibs 等迁移中，不影响编译
android.suppressDeprecatedNdkAPI=true
